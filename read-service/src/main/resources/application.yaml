spring:
  application:
    name: read-service

  datasource:
    url: ${READ_DB_URL:jdbc:postgresql://localhost:5433/cqrs_read_db}
    username: ${DB_USERNAME:cqrs_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cqrs-read-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  cqrs:
    topic: cqrs.public.products

server:
  port: 8082