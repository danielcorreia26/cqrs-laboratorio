spring:
  application:
    name: write-service

  datasource:
    url: ${WRITE_DB_URL:jdbc:postgresql://localhost:5433/cqrs_write_db}
    username: ${DB_USERNAME:cqrs_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8081