
services:
  postgres:
    image: postgres:16
    container_name: cqrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - cqrs_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

  mongodb:
    image: mongo:8.0
    container_name: cqrs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cqrs_mongodb_data:/data/db

volumes:
  cqrs_postgres_data:
  cqrs_mongodb_data:

