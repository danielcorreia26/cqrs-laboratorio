server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: write-service
              uri: ${WRITE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/products/**
                - Method=POST,PUT,DELETE

            - id: read-service
              uri: ${READ_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
                - Method=GET
