apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cqrs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: WRITE_SERVICE_URL
              value: "http://write-service:8081"
            - name: READ_SERVICE_URL
              value: "http://read-service:8082"
